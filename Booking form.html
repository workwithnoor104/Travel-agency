<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="B&T.css">
</head>
<body>
    <h2 class="head1">B&T Reservation Form</h2>
    <div id="packageName"></div>
  <div id="form">
   <div id="form2">  <div><h2 class="form-heading">Name</h2>
  <input type="text" placeholder="Enter your Full name" class="placeholder"></div>
   <div id="Email"><h2 class="form-heading">Email</h2>
    <input type="email" placeholder="@gmail.com" class="placeholder"></div>
   <div id="Age"><h2 class="form-heading">Age</h2>
    <input type="number" placeholder="XX" class="placeholder"></div>
   <div id="Phone"><h2 class="form-heading">Phone</h2>
    <input type="tel" placeholder="Contact number" class="placeholder"></div>
   <div id="Travelers"><h2 class="form-heading">Travelers</h2>
    <input type="number" placeholder="Total number of travelers" class="placeholder"></div>
    <div id="Date"><h2 class="form-heading">Date</h2>
    <input type="date" placeholder="XX/XX/XXXX" class="placeholder"></div>
    <div id="Comment"><h2 class="form-heading">Comment(optional)</h2>
    <textarea placeholder="Write your Message" id="comment"></textarea></div>
    
  </div></div>
    <button id="Submit">Submit</button>
    <script src="B&T.js"></script>
</body>
</html>
